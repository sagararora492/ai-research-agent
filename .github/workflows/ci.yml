name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: research-assistant "Research assistants" --provider local --documents examples/documents.json --no-persist
      - run: research-assistant-web --help
      - run: python -c "from agentic_research_assistant.web import STATIC; assert (STATIC / 'index.html').is_file(); assert (STATIC / 'app.js').is_file()"
